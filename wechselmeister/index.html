@font-face{font-family:Raleway;src:url(https://cdn.jsdelivr.net/npm/@fontsource/raleway@5.3.0/files/raleway-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Raleway;src:url(https://cdn.jsdelivr.net/npm/@fontsource/raleway@5.3.0/files/raleway-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Raleway;src:url(https://cdn.jsdelivr.net/npm/@fontsource/raleway@5.3.0/files/raleway-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Raleway;src:url(https://cdn.jsdelivr.net/npm/@fontsource/raleway@5.3.0/files/raleway-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.3.0/files/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.3.0/files/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#e8e8e8; --ink:#342e2e; --muted:#6f6965; --soft:#8f8984; --line:#cfcdc7; --line2:#deddd9;
  --card:#f7f7f6; --card2:#f2f1ef; --taupe:#968e82; --taupe2:#b9b5ae; --on-taupe:#fbfbfb;
  --dark:#342e2e; --on-dark:#fbfbfb; --ok:#3f7d4e; --warn:#a8741a; --err:#9d3b3b;
  --r:28px; --r2:18px; --pill:999px;
  --head:"Space Grotesk",Raleway,Arial,sans-serif; --body:Raleway,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,.head{font-family:var(--head);font-weight:500;letter-spacing:-.01em;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
/* Kopf */
.top{background:var(--taupe);color:var(--on-taupe)}
.top .in{max-width:1080px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{width:52px;height:52px;border-radius:6px;display:block}
.brand b{display:block;font-family:var(--head);font-weight:700;font-size:1.08rem}
.brand small{display:block;opacity:.85;font-size:.78rem}
.trust{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;opacity:.95}
.trust span::before{content:"✓ ";font-weight:700}
/* Fortschritt */
.prog{display:grid;gap:8px;margin:22px 0 18px}
.prog .row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--dark);transition:width .3s ease}
/* Karten */
.card{background:var(--card);border-radius:var(--r);padding:clamp(20px,4vw,40px);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.card h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;margin-bottom:14px}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.toggle button{border:1.5px solid var(--line);background:transparent;border-radius:var(--pill);min-height:58px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.toggle button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-size:.88rem;font-weight:500;align-content:start}
/* Startseite */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(18px,4vw,48px);align-items:center;padding:clamp(24px,5vw,56px) 0 8px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5.6vw,3.6rem);line-height:1.02;margin:0 0 16px}
.hero h1 em{font-style:normal;color:var(--taupe)}
.hero .lead{font-size:1.08rem}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:center;font-weight:500}
.ticks li::before{content:"✓";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--dark);color:var(--on-dark);font-size:.8rem;font-weight:700;flex:none}
.calc{box-shadow:0 18px 40px -24px rgba(52,46,46,.45)}
.calc h2{font-size:1.5rem;margin-bottom:16px}
.sec{margin-top:clamp(40px,7vw,80px)}
.sec>h2{font-size:clamp(1.6rem,4vw,2.5rem);margin:0 0 8px;text-align:center}
.sec>.sub{color:var(--muted);text-align:center;margin:0 auto 26px;max-width:58ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;counter-reset:st}
.steps div{background:var(--card);border-radius:var(--r);padding:26px 22px;position:relative}
.steps div::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--taupe);color:var(--on-taupe);font-family:var(--head);font-weight:700;font-size:1.2rem;margin-bottom:14px}
.steps b,.why b{display:block;font-family:var(--head);font-weight:500;font-size:1.15rem;margin-bottom:6px}
.steps p,.why p{margin:0;color:var(--muted);font-size:.94rem}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.why div{background:var(--card);border-radius:var(--r2);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.why i{font-style:normal;grid-row:span 2;width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:1.35rem}
.band{background:var(--dark);color:var(--on-dark);border-radius:var(--r);padding:clamp(24px,5vw,48px);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.band h2{font-size:clamp(1.5rem,3.6vw,2.2rem);margin:0 0 6px}
.band p{margin:0;opacity:.85}
.band .btn{background:var(--on-dark);color:var(--dark)}
@media (max-width:700px){.band{grid-template-columns:1fr}}
.faq{max-width:820px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--card);border-radius:var(--r2);padding:0 20px}
.faq summary{cursor:pointer;list-style:none;padding:18px 30px 18px 0;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:14px;font-size:1.5rem;font-weight:400;color:var(--muted)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 18px;color:var(--muted)}
/* Vertreter-Modus */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--dark);color:var(--on-dark);border-radius:var(--r2);padding:10px 14px;margin-top:16px;font-size:.9rem}
.vbar b{font-family:var(--head);font-weight:500}
.vbar .sp{margin-right:auto}
.vbar button,.vbar a{background:rgba(255,255,255,.12);color:var(--on-dark);border:0;border-radius:var(--pill);padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.85rem}
.vbar button[aria-pressed="true"]{background:var(--on-dark);color:var(--dark)}
.prov{display:inline-block;margin-top:8px;background:#dfeee2;color:var(--ok);border-radius:var(--pill);padding:3px 12px;font-size:.82rem;font-weight:700}
.pill.offen{background:#f3e6c9;border-color:#e3cf9f}.pill.freigegeben{background:#dfeee2;border-color:#bcd9c2;color:var(--ok)}.pill.ausgezahlt{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
label.f small{color:var(--muted);font-weight:400}
.in-f{width:100%;min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:var(--pill);padding:0 20px;font-size:1rem}
textarea.in-f{border-radius:var(--r2);padding:12px 16px;min-height:90px}
select.in-f{appearance:auto}
.in-f:focus{outline:none;border-color:var(--dark);box-shadow:0 0 0 3px rgba(52,46,46,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--card2);border-radius:var(--pill);padding:6px 12px;font-size:.82rem;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--pill);min-height:54px;padding:0 26px;background:var(--dark);color:var(--on-dark);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.88rem;cursor:pointer;text-decoration:none}
.btn.full{width:100%;margin-top:20px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);text-transform:none;letter-spacing:0}
.btn.small{min-height:40px;padding:0 16px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.toggle button:focus-visible,.offer:focus-within{outline:3px solid var(--taupe);outline-offset:2px}
.err{background:#f6e6e6;color:var(--err);border-radius:var(--r2);padding:12px 16px;margin:14px 0 0;font-weight:500}
.note{background:var(--card2);border-radius:var(--r2);padding:12px 16px;color:var(--muted);font-size:.9rem;margin:0 0 16px}
/* Vorteile */
.feat{margin-top:22px;background:var(--taupe);color:var(--on-taupe);border-radius:var(--r);padding:clamp(20px,4vw,40px)}
.feat h2{font-size:clamp(1.4rem,3.6vw,2rem);margin:0 0 20px}
.feat .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.feat .cols div{background:rgba(255,255,255,.12);border-radius:var(--r2);padding:18px}
.feat b{display:block;font-family:var(--head);font-weight:500;font-size:1.05rem;margin-bottom:4px}
.feat p{margin:0;opacity:.92;font-size:.92rem}
/* Angebote */
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sum .kicker{margin:0}
.offers{display:grid;gap:14px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:var(--r2);padding:18px;cursor:pointer}
.offer.sel{border-color:var(--dark);box-shadow:0 0 0 2px var(--dark) inset}
.offer input{width:22px;height:22px;accent-color:var(--dark)}
.offer .badge{display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--card2);border-radius:var(--pill);padding:3px 10px;color:var(--muted);font-weight:600;margin-bottom:6px}
.offer h3{font-size:1.3rem}
.offer .meta{color:var(--muted);font-size:.88rem;margin:2px 0 10px}
.offer .prices{display:flex;gap:22px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.offer .prices b{display:block;color:var(--ink);font-size:1rem}
.offer .cost{text-align:right}
.offer .cost b{display:block;font-family:var(--head);font-size:1.7rem;font-weight:700}
.offer .cost small{color:var(--muted);font-size:.82rem}
.demo{display:inline-block;margin-left:6px;font-size:.7rem;background:#f3e6c9;color:#7a5410;border-radius:var(--pill);padding:2px 8px;font-weight:600;vertical-align:middle}
@media (max-width:620px){.offer{grid-template-columns:auto 1fr}.offer .cost{grid-column:2;text-align:left}}
/* Auftrag */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.checks{display:grid;gap:10px;margin:22px 0 8px;padding-top:18px;border-top:1px solid var(--line2)}
.checks label{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border-radius:var(--r2);padding:14px 16px;font-size:.9rem;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:1px;accent-color:var(--dark);flex:none}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.aside h3{font-size:1.3rem;margin-bottom:4px}
.aside .big{font-family:var(--head);font-size:2.2rem;font-weight:700;margin:10px 0 0}
.aside ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;font-size:.92rem}
.aside li::before{content:"✓ ";font-weight:700}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:clamp(28px,6vw,56px)}
.done .ref{display:inline-block;font-family:var(--head);font-size:1.4rem;background:var(--card2);border-radius:var(--pill);padding:8px 20px;margin:12px 0 18px}
/* Fuß */
footer{max-width:1080px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 40px;display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
footer button,footer a{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline;font-size:inherit}
footer .sp{margin-right:auto}
dialog{border:0;border-radius:var(--r);padding:0;max-width:min(720px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,26,26,.45)}
dialog .dl{padding:24px;max-height:80vh;overflow:auto}
dialog h2{margin-bottom:12px}
/* Admin */
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.atabs button{border:1.5px solid var(--line);background:var(--card);border-radius:var(--pill);padding:10px 16px;font-weight:600;cursor:pointer;font-size:.9rem}
.atabs button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.atabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--err);color:#fff;font-size:.75rem;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r2);padding:16px}
.kpi b{display:block;font-family:var(--head);font-size:2rem;font-weight:700}
.kpi span{color:var(--muted);font-size:.86rem}
.list{display:grid;gap:10px}
.item{background:var(--card);border-radius:var(--r2);padding:14px 16px}
.item .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0}
.item .hd b{font-size:1rem}
.item .hd .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:var(--pill);padding:2px 10px;font-size:.76rem;font-weight:600;background:var(--card2);border:1px solid var(--line2);white-space:nowrap}
.pill.neu{background:#f3e6c9;border-color:#e3cf9f}.pill.bestaetigt{background:#e2ecf6;border-color:#c5d6ea}
.pill.uebermittelt{background:#e4eef0;border-color:#c3d8dc}.pill.aktiv{background:#dfeee2;border-color:#bcd9c2;color:var(--ok)}
.pill.abgelehnt,.pill.storniert{background:#f6e6e6;border-color:#e6c4c4;color:var(--err)}
.pill.anfrage{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2);display:grid;gap:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:var(--pill);font-size:.9rem;z-index:50;max-width:92vw}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);

}

    sb.from('wm_reminders').select('*').is('done_at', null).order('due_date'),
    sb.from('wm_tariffs').select('*').order('commodity').order('position').order('name'),

  if (bad) throw new Error(/does not exist|schema cache/i.test(bad.error.message) ? 'Die Datenbank ist für den Wechselmeister noch nicht eingerichtet (SQL „wechselmeister.sql“).' : bad.error.message);

function route() {
  const tok = new URLSearchParams(location.search).get('bestaetigen');
  $('trust').hidden = location.hash === '#admin' || VM;
  if (EMBED) { document.querySelector('header.top').hidden = true; document.querySelector('footer').style.display = 'none'; }
  if (tok && /^[0-9a-f-]{36}$/i.test(tok)) confirmView(tok);
  else if (location.hash === '#admin') renderAdmin();
  else if (VM) vInit();
  else renderPublic();
}
window.addEventListener('hashchange', route);
